<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Oblivion">
  <title>Oblivion</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D1F27"/><stop offset="1" stop-color="#111216"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C8BFF" stop-opacity=".45"/><stop offset="1" stop-color="#7C8BFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C8BFF" stop-opacity="0"/><stop offset=".5" stop-color="#7C8BFF" stop-opacity=".9"/><stop offset="1" stop-color="#7C8BFF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="580" height="200" rx="16"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .halo { transform-origin: 512px 52px; animation: halo 4s ease-in-out 0.35s infinite; }
      @keyframes halo { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
      .shine { animation: shine 5s cubic-bezier(.6,0,.4,1) 0.50s infinite; }
      @keyframes shine { 0% { transform: translateX(-220px); } 60%, 100% { transform: translateX(620px); } }
      .ico { transform-origin: 512px 52px; animation: bob 3s ease-in-out 0.20s infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="200" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="579" height="199" rx="15.5" fill="none" stroke="#7C8BFF" stroke-opacity=".22"/>
    <rect class="shine" x="0" y="0" width="200" height="2" fill="url(#shine)"/>
    <circle class="halo" cx="512" cy="52" r="58" fill="url(#halo)"/>
    <g class="ico"><g transform="translate(512 52)"><path d="M17.3 -10 A20 20 0 1 1 6.8 -18.8" fill="none" stroke="#7C8BFF" stroke-width="7" stroke-linecap="round"/><circle cx="16" cy="-21" r="3.2" fill="#7C8BFF"/><circle cx="24" cy="-25" r="2" fill="#7C8BFF" opacity=".7"/></g></g>
    <text x="32" y="56" font-size="28" font-weight="700" fill="#FFFFFF">Oblivion</text>
    <text x="32" y="80" font-size="13" font-weight="600" fill="#7C8BFF" letter-spacing=".6">WINDOWS · MACOS</text>
    <text x="32" y="112" font-size="16" fill="#C9CFDA">Programları iz bırakmadan kaldıran,</text>
    <text x="32" y="134" font-size="16" fill="#C9CFDA">sistemi güvenle temizleyen araç.</text>
    <rect x="32" y="150" width="80" height="28" rx="14" fill="#7C8BFF" fill-opacity=".12" stroke="#7C8BFF" stroke-opacity=".45"/><text x="72" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#7C8BFF">C# / WPF</text>
    <rect x="119.6" y="150" width="71" height="28" rx="14" fill="#7C8BFF" fill-opacity=".12" stroke="#7C8BFF" stroke-opacity=".45"/><text x="155" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#7C8BFF">SwiftUI</text>
    <rect x="199" y="150" width="63" height="28" rx="14" fill="#7C8BFF" fill-opacity=".12" stroke="#7C8BFF" stroke-opacity=".45"/><text x="231" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#7C8BFF">.NET 8</text>
    <text x="548" y="172" text-anchor="end" font-size="20" font-weight="700" fill="#7C8BFF" opacity=".85">&#8594;</text>
  </g>
</svg>
