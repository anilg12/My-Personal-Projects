<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="StockFlow">
  <title>StockFlow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111823"/><stop offset="1" stop-color="#0A0E14"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2BE8CE" stop-opacity=".45"/><stop offset="1" stop-color="#2BE8CE" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2BE8CE" stop-opacity="0"/><stop offset=".5" stop-color="#2BE8CE" stop-opacity=".9"/><stop offset="1" stop-color="#2BE8CE" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="580" height="200" rx="16"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .halo { transform-origin: 512px 52px; animation: halo 4s ease-in-out 1.05s infinite; }
      @keyframes halo { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
      .shine { animation: shine 5s cubic-bezier(.6,0,.4,1) 1.50s infinite; }
      @keyframes shine { 0% { transform: translateX(-220px); } 60%, 100% { transform: translateX(620px); } }
      .ico { transform-origin: 512px 52px; animation: bob 3s ease-in-out 0.60s infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="200" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="579" height="199" rx="15.5" fill="none" stroke="#2BE8CE" stroke-opacity=".22"/>
    <rect class="shine" x="0" y="0" width="200" height="2" fill="url(#shine)"/>
    <circle class="halo" cx="512" cy="52" r="58" fill="url(#halo)"/>
    <g class="ico"><g transform="translate(512 52)"><rect x="-22" y="2" width="9" height="20" rx="2" fill="#2BE8CE" opacity=".55"/><rect x="-9" y="-8" width="9" height="30" rx="2" fill="#2BE8CE" opacity=".75"/><rect x="4" y="-20" width="9" height="42" rx="2" fill="#2BE8CE"/><rect x="17" y="-4" width="6" height="26" rx="2" fill="#2BE8CE" opacity=".45"/></g></g>
    <text x="32" y="56" font-size="28" font-weight="700" fill="#FFFFFF">StockFlow</text>
    <text x="32" y="80" font-size="13" font-weight="600" fill="#2BE8CE" letter-spacing=".6">BITIRME PROJESI</text>
    <text x="32" y="112" font-size="16" fill="#C9CFDA">Stok takip ve müşteri ilişkileri yönetimi,</text>
    <text x="32" y="134" font-size="16" fill="#C9CFDA">sıfır bağımlılık.</text>
    <rect x="32" y="150" width="63" height="28" rx="14" fill="#2BE8CE" fill-opacity=".12" stroke="#2BE8CE" stroke-opacity=".45"/><text x="64" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#2BE8CE">Python</text>
    <rect x="103.19999999999999" y="150" width="71" height="28" rx="14" fill="#2BE8CE" fill-opacity=".12" stroke="#2BE8CE" stroke-opacity=".45"/><text x="139" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#2BE8CE">tkinter</text>
    <rect x="182.59999999999997" y="150" width="63" height="28" rx="14" fill="#2BE8CE" fill-opacity=".12" stroke="#2BE8CE" stroke-opacity=".45"/><text x="214" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#2BE8CE">SQLite</text>
    <text x="548" y="172" text-anchor="end" font-size="20" font-weight="700" fill="#2BE8CE" opacity=".85">&#8594;</text>
  </g>
</svg>
