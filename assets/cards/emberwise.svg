<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Emberwise">
  <title>Emberwise</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1F3D"/><stop offset="1" stop-color="#16101F"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F8834C" stop-opacity=".45"/><stop offset="1" stop-color="#F8834C" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8834C" stop-opacity="0"/><stop offset=".5" stop-color="#F8834C" stop-opacity=".9"/><stop offset="1" stop-color="#F8834C" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="580" height="200" rx="16"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .halo { transform-origin: 512px 52px; animation: halo 4s ease-in-out 0.00s infinite; }
      @keyframes halo { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
      .shine { animation: shine 5s cubic-bezier(.6,0,.4,1) 0.00s infinite; }
      @keyframes shine { 0% { transform: translateX(-220px); } 60%, 100% { transform: translateX(620px); } }
      .ico { transform-origin: 512px 52px; animation: bob 3s ease-in-out 0.00s infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="200" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="579" height="199" rx="15.5" fill="none" stroke="#F8834C" stroke-opacity=".22"/>
    <rect class="shine" x="0" y="0" width="200" height="2" fill="url(#shine)"/>
    <circle class="halo" cx="512" cy="52" r="58" fill="url(#halo)"/>
    <g class="ico"><g transform="translate(512 52)"><path d="M0 -26 C10 -14 18 -6 18 6 C18 18 9 26 0 26 C-9 26 -18 18 -18 6 C-18 -4 -10 -10 -6 -18 C-4 -10 0 -8 2 -6 C4 -12 2 -20 0 -26 Z" fill="#F8834C"/><path d="M0 4 C5 9 7 12 7 16 C7 21 4 24 0 24 C-4 24 -7 21 -7 16 C-7 12 -3 9 0 4 Z" fill="#FFE2B8"/></g></g>
    <text x="32" y="56" font-size="28" font-weight="700" fill="#FFFFFF">Emberwise</text>
    <text x="32" y="80" font-size="13" font-weight="600" fill="#F8834C" letter-spacing=".6">WINDOWS · MACOS</text>
    <text x="32" y="112" font-size="16" fill="#C9CFDA">Görevleri maceraya, odağı XP'ye çeviren</text>
    <text x="32" y="134" font-size="16" fill="#C9CFDA">sıcak bir odak oyunu.</text>
    <rect x="32" y="150" width="80" height="28" rx="14" fill="#F8834C" fill-opacity=".12" stroke="#F8834C" stroke-opacity=".45"/><text x="72" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#F8834C">Svelte 5</text>
    <rect x="119.6" y="150" width="96" height="28" rx="14" fill="#F8834C" fill-opacity=".12" stroke="#F8834C" stroke-opacity=".45"/><text x="168" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#F8834C">TypeScript</text>
    <rect x="223.6" y="150" width="80" height="28" rx="14" fill="#F8834C" fill-opacity=".12" stroke="#F8834C" stroke-opacity=".45"/><text x="263" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#F8834C">Electron</text>
    <text x="548" y="172" text-anchor="end" font-size="20" font-weight="700" fill="#F8834C" opacity=".85">&#8594;</text>
  </g>
</svg>
